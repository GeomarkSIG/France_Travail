name: Mettre à jour les offres d'emploi (974)

on:
  schedule:
    - cron: "17 3 * * *" # tous les jours à 03h17 UTC (~07h17 heure Réunion)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Récupérer les offres depuis l'API France Travail
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python scripts/fetch_offres.py

      - name: Commit et push si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offres.geojson
          git diff --cached --quiet && echo "Aucun changement" || git commit -m "chore: mise à jour des offres d'emploi 974"
          git push
